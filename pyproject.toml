[project]
name = "ccaudit"
dynamic = ["version"]
description = "Local-first cost observability for Claude Code sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.7",
]

# Convenience only. `ccaudit notebook` writes a notebook that declares its own dependencies
# inline (PEP 723), so `uvx marimo edit --sandbox <file>` needs none of this — the extra exists
# for someone who would rather have marimo installed than sandboxed.
[project.optional-dependencies]
notebook = [
    "marimo>=0.9",
    "altair>=5",
    "pandas>=2",
]

[project.scripts]
ccaudit = "ccaudit.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The git tag is the version. Nothing to bump in a file, so a release cannot be tagged with
# one number and built with another.
[tool.hatch.version]
source = "vcs"
# A source tree with neither `.git` nor `PKG-INFO` — a GitHub zip download — otherwise fails
# the build outright rather than producing something. Verified: without this it errors; with
# it, the build succeeds and labels itself 0.0.0, which is honest about knowing nothing.
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/ccaudit"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Vendored agent tooling, not project code — linted upstream, not here.
extend-exclude = [".claude", ".specify"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the test tree as a package so fixtures (tests/fixtures/builder.py) are shared
# rather than copy-pasted across test modules.
pythonpath = ["."]
markers = [
    "golden: golden-file regression tests pinning attribution arithmetic (a diff is a red alert)",
    "system: merge-gate tests running the real CLI over a transcript corpus",
]
